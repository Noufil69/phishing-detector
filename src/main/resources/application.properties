spring.application.name=phishing-detector

# Render provides PORT at runtime; 8080 is the local default.
server.port=${PORT:8080}

# Local development only: also read settings from a .env file in the project folder,
# if one exists. .env is gitignored. On Render there is no .env file, so the
# dashboard's environment variables are used instead. The "optional:" means the app
# still starts when the file is missing.
spring.config.import=optional:file:.env[.properties]

# Google Safe Browsing API key - never a real value here.
# Set the real key as an environment variable, locally via .env (see .env.example)
# and in production via Render's dashboard environment settings.
safebrowsing.api-key=${SAFE_BROWSING_API_KEY:}

# Per-external-call timeouts (ms) - see SECURITY.md / TRD.md non-functional requirements.
heuristics.http-timeout-ms=4000